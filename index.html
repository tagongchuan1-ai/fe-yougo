<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FE用語帳</title>
<meta name="description" content="基本情報技術者試験（シラバスVer.9.2）の用語帳と4択クイズ">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D121A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FE用語帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app. Sticky header (title + overall progress), one view per tab, fixed bottom tab bar.
   Each syllabus "系統" carries its own hue (テクノロジ=blue / マネジメント=teal / ストラテジ=amber) used on tiles, card bands and list headers. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --sunk:#E2E7EE; --ink:#162033; --muted:#5A6477; --line:#D2D9E3;
  --accent:#2251C9; --accent-ink:#FFFFFF; --mark:#D9480F;
  --ok:#1C8550; --ok-bg:#E1F3E8; --ng:#C93434; --ng-bg:#FBE6E6;
  --tech:#2251C9; --mgmt:#0E8577; --strat:#BF5B0B;
  --tech-bg:#E4EBFB; --mgmt-bg:#DFF2EF; --strat-bg:#FBEBDD;
  --shadow:0 1px 2px rgb(22 32 51 / .06),0 6px 18px rgb(22 32 51 / .07);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-disp:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121A; --surface:#172030; --sunk:#111925; --ink:#E6EBF2; --muted:#98A3B5; --line:#283447;
  --accent:#7FA2FF; --accent-ink:#0D121A; --mark:#FF8A4C;
  --ok:#4FC28B; --ok-bg:#132D1E; --ng:#FF6E6E; --ng-bg:#371A1C;
  --tech:#7FA2FF; --mgmt:#4FCDBB; --strat:#F5A25B;
  --tech-bg:#1A2645; --mgmt-bg:#12302C; --strat-bg:#352414;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121A; --surface:#172030; --sunk:#111925; --ink:#E6EBF2; --muted:#98A3B5; --line:#283447;
  --accent:#7FA2FF; --accent-ink:#0D121A; --mark:#FF8A4C;
  --ok:#4FC28B; --ok-bg:#132D1E; --ng:#FF6E6E; --ng-bg:#371A1C;
  --tech:#7FA2FF; --mgmt:#4FCDBB; --strat:#F5A25B;
  --tech-bg:#1A2645; --mgmt-bg:#12302C; --strat-bg:#352414;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.c-tech{--fc:var(--tech);--fb:var(--tech-bg)} .c-mgmt{--fc:var(--mgmt);--fb:var(--mgmt-bg)} .c-strat{--fc:var(--strat);--fb:var(--strat-bg)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:900;font-size:22px;margin:0;line-height:1.2;letter-spacing:.02em}
.brand .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.ring{flex:none;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);line-height:1.3;text-align:right}
.ring b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--sunk)} .ring .fgc{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .4s}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button .ic{font-family:var(--f-disp);font-weight:900;font-size:16px;line-height:1;width:30px;height:24px;display:grid;place-items:center;border-radius:8px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-current="page"] .ic{background:var(--accent);color:var(--accent-ink)}
nav.tabs .badge[hidden]{display:none}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ng);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center}

section.view{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.h2{font-family:var(--f-disp);font-weight:900;font-size:19px;margin:0;line-height:1.35}
.sec-label{font-size:11.5px;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-label button{background:none;border:0;color:var(--accent);font-size:12px;padding:0 8px;min-height:36px;margin:-8px -8px -8px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;color:var(--muted)}
.stars{color:var(--mark);letter-spacing:1px;font-size:12.5px;white-space:nowrap}
.tag{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.scroller::-webkit-scrollbar{display:none}
.btn{border-radius:14px;padding:13px 10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;line-height:1.3}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toggle{min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:8px}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fc,var(--ok));border-radius:3px}

/* ---- deck home: field tiles ---- */
.mix{display:flex;align-items:center;gap:14px;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.mix .big{font-family:var(--f-disp);font-weight:900;font-size:18px;line-height:1.3}
.mix .s{font-size:12px;opacity:.75}
.mix .go{margin-left:auto;font-family:var(--f-disp);font-weight:900;font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px 13px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--fc)}
.tile .no{font-family:var(--f-mono);font-size:11px;color:var(--fc);font-weight:600}
.tile .nm{font-weight:700;font-size:14px;line-height:1.35;min-height:2.7em;overflow-wrap:anywhere}
.tile .ct{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.tile.done .nm::after{content:" ✓";color:var(--ok)}

/* ---- deck ---- */
.deckbar{display:flex;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 0;flex:none}
.deckbar .ttl{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.deckbar .pos{flex:none;font-size:12px;color:var(--muted)}
.stack{position:relative;min-height:390px}
.card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 0 18px;min-height:390px;display:flex;flex-direction:column;box-shadow:var(--shadow);touch-action:pan-y;cursor:grab;overflow:hidden;will-change:transform}
.card.under{position:absolute;inset:0;z-index:1;transform:scale(.95) translateY(12px);opacity:.75;pointer-events:none;box-shadow:none}
.card .band{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;background:var(--fb);color:var(--fc);font-size:12px;font-weight:700}
.card .band .sc{display:flex;gap:6px;align-items:center;min-width:0}
.card .band .sc span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .face{flex:1;display:flex;flex-direction:column;padding:0 20px;gap:12px}
.card .term{font-family:var(--f-disp);font-weight:900;font-size:clamp(26px,8.2vw,38px);line-height:1.3;margin:auto 0;padding-block:28px 10px;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.card .rdg{text-align:center;color:var(--muted);font-size:13px;margin-top:-6px}
.card .hint{text-align:center;font-size:12px;color:var(--muted);display:flex;justify-content:center;gap:14px}
.card .detail{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.stamp{position:absolute;top:58px;z-index:3;font-family:var(--f-disp);font-weight:900;font-size:22px;padding:4px 14px;border:3px solid;border-radius:10px;opacity:0;pointer-events:none;transform:rotate(-10deg)}
.stamp.yes{left:18px;color:var(--ok);border-color:var(--ok)}
.stamp.no{right:18px;color:var(--ng);border-color:var(--ng);transform:rotate(10deg)}
.kn{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--ok);font-weight:700}
.kv{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font-size:11px;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{font-size:15px;line-height:1.85;margin:0}
.actions{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:stretch}
.actions .undo{border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);padding:0}
.swipehint{text-align:center;font-size:11.5px;color:var(--muted)}

/* ---- quiz ---- */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:10px}
.qbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.prompt::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--fc)}
.prompt .q{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.prompt .p{font-size:16px;line-height:1.9;margin:0;overflow-wrap:anywhere}
.prompt .p.big{font-family:var(--f-disp);font-weight:900;font-size:27px;line-height:1.35;padding-block:6px}
.mask{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--mark);color:transparent;line-height:1.2}
.qhint{font-size:11.5px;color:var(--muted);text-align:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:52px 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.choice .mk{border:0;border-right:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;padding:10px 0}
.choice .mk span{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:16px;background:var(--surface)}
.choice .tx{border:0;background:none;text-align:left;padding:12px 14px;font-size:15px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.choice.long .tx{font-size:13.5px}
.choice.struck .tx{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ng);color:var(--muted)}
.choice.struck .mk span{opacity:.4}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .mk{background:var(--ok)} .choice.right .mk span{border-color:var(--ok);color:var(--ok);opacity:1}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg)}
.choice.wrong .mk{background:var(--ng)} .choice.wrong .mk span{border-color:var(--ng);color:var(--ng);opacity:1}
.choice.right .tx,.choice.wrong .tx{text-decoration:none;color:var(--ink)}
.choice button[disabled]{cursor:default}
.verdict{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.verdict.ng{background:var(--ng-bg);border:1px solid var(--ng)}
.verdict h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.verdict.ok h3{color:var(--ok)} .verdict.ng h3{color:var(--ng)}
.verdict .ans{font-family:var(--f-disp);font-weight:900;font-size:20px;line-height:1.35}
.sticky-next{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:3}
.score{font-family:var(--f-disp);font-weight:900;font-size:52px;line-height:1}
.score small{font-size:18px;color:var(--muted)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .gh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fc);font-weight:700;letter-spacing:.04em}
.fgroup .gh button{background:none;border:0;color:var(--accent);font-size:12px;padding:0 8px;min-height:36px;margin:-6px -8px -6px 0;font-weight:400}
.fgroup .chip[aria-pressed="true"]{background:var(--fc);border-color:var(--fc);color:var(--surface)}

/* ---- list ---- */
.searchbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--bg);padding-block:2px 6px;display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:18px;width:34px;height:34px;border-radius:50%}
.count{font-size:12px;color:var(--muted);margin:0}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fsec>summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.fsec>summary::-webkit-details-marker{display:none}
.fsec .no{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--fc);background:var(--fb);border-radius:8px;padding:2px 7px}
.fsec .nm{font-weight:700;min-width:0}
.fsec .ct{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
.fsec .chev{transition:transform .2s;display:inline-block;margin-left:6px}
.fsec[open] .chev{transform:rotate(180deg)}
.fsec .bar{margin:0 14px 10px}
.items{border-top:1px solid var(--line)}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 14px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .t .k{color:var(--ok);font-size:11px;margin-left:6px}
.item .s{grid-column:1/-1;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.subhd{padding:8px 14px 4px;font-size:11px;color:var(--muted);background:var(--sunk);font-family:var(--f-mono)}
mark{background:color-mix(in srgb,var(--mark) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.tier{display:flex;flex-direction:column;gap:8px}
.tier h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.tier h3 .pill{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted);font-weight:400}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.flat .item .s .fld{color:var(--fc);font-weight:700}

/* ---- weak ---- */
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.wstat b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.2}
.wstat span{font-size:11.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>FE用語帳</h1><div class="sub">基本情報 シラバス Ver.9.2</div></div>
    <div class="ring" id="ring"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="モード"><div class="in">
  <button type="button" data-tab="cards"><span class="ic">札</span>単語カード</button>
  <button type="button" data-tab="quiz"><span class="ic">ア</span>4択クイズ</button>
  <button type="button" data-tab="weak"><span class="ic">弱</span>苦手<span class="badge" id="wbadge" hidden></span></button>

するための仕様。",1,"23-5",0],["文字コード","もじこーど","Character Code","","文字をコンピュータで扱うために、各文字に割り当てた番号。",1,"23-5",0],["JANコード","じゃんこーど","Japanese Article Number Code","","商品を識別するための13桁または8桁のバーコード。国コード・事業者コード・商品コード・チェックディジットで構成。",2,"23-5",0],["QRコード","きゅーあーるこーど","QR Code","","縦横の2方向に情報を持つ2次元コード。大量の情報を記録でき、一部が汚れても読み取れる。",2,"23-5",0],["ITFコード","あいてぃーえふこーど","ITF Code","","段ボール箱など、物流で使われるバーコード。",1,"23-5",0],["ISBNコード","あいえすびーえぬこーど","International Standard Book Number","","書籍を識別するための国際的なコード。",1,"23-5",0],["適合性評価","てきごうせいひょうか","Conformity Assessment","","製品やシステムが規格などの要求を満たしているかを評価すること。",1,"23-5",0],["適合性評価機関","てきごうせいひょうかきかん","Conformity Assessment Body","","適合性評価を行う機関。認証機関や試験機関など。",1,"23-5",0],["認定機関","にんていきかん","Accreditation Body","","認証機関や試験機関が適切な能力を持っているかを審査し、認定する機関。",1,"23-5",0],["認証機関","にんしょうきかん","Certification Body","","製品やマネジメントシステムが規格に適合していることを審査・認証する機関。",1,"23-5",0],["試験機関","しけんきかん","Testing Laboratory","","製品などが規格に適合しているかを試験する機関。",1,"23-5",0],["SLCP-JCF","","共通フレーム（Software Life Cycle Process - Japan Common Frame）","","ソフトウェアの企画から廃棄までの作業内容と用語を統一した枠組み。発注者と開発者の共通言語。",3,"23-5",0],["JIS X 0160","じすえっくすぜろいちろくぜろ","JIS X 0160 (ISO/IEC 12207)","","ソフトウェアライフサイクルプロセスを定めた規格。開発・運用・保守などの作業を定義。",2,"23-5",0],["ISO/IEC15408","あいえすおーあいいーしーいちごーよんぜろはち","コモンクライテリア（ISO/IEC 15408 (Common Criteria)）","","IT製品のセキュリティ機能や品質を評価するための国際規格（コモンクライテリア）。",2,"23-5",0],["CORBA","こるば","Common Object Request Broker Architecture","","異なる環境のオブジェクト同士を連携させるための分散オブジェクト技術の標準。",1,"23-5",0],["JISコード","じすこーど","JIS Code","","JISが定めた日本語文字コード。メールなどで使われてきた。",1,"23-5",0],["Unicode","ゆにこーど","国際的な統一文字コード","","世界中の文字を1つの体系で扱うための文字コード規格。UTF-8などの符号化方式がある。",3,"23-5",0],["デファクトスタンダード","","De Facto Standard","事実上の標準","公的機関が定めたものではなく、市場で広く使われることで事実上の標準となった規格。",2,"23-5",1]]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const FIELDS = [['テクノロジ系','tech',1,13],['マネジメント系','mgmt',14,16],['ストラテジ系','strat',17,23]];
const fcls = m => m<=13?'c-tech':(m<=16?'c-mgmt':'c-strat');
const T = DATA.items.map((a,i)=>({i, jp:a[0], rd:a[1], mn:a[2], al:a[3], ds:a[4], imp:a[5], sub:a[6], add:a[7], maj:+a[6].split('-')[0], key:a[6]+'|'+a[0], als:new Set((a[3]||'').split('、').map(s=>s.trim()).filter(Boolean))}));
const byMajor = {}; T.forEach(t=>{(byMajor[t.maj]=byMajor[t.maj]||[]).push(t)});
const STARS = {3:'★★★',2:'★★',1:'★'};
const KANA = 'アイウエ';
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN = m=>DATA.majors[m-1];

// ---------- storage ----------
const SKEY='fe-vocab-v1';
const DEF = {known:{}, wrong:{}, right:{}, tab:'cards',
  cards:{imp:[3,2,1], hideKnown:false}, quiz:{maj:[], imp:[3,2,1], n:10, mode:'d2t'}};
let S = JSON.parse(JSON.stringify(DEF));
const KEYS = new Set(T.map(t=>t.key));
const isObj = v => v && typeof v==='object' && !Array.isArray(v);
// 今のデータに無いキー（将来の用語名変更など）も消さずに残す。ただし件数・長さに上限を設ける。
function cleanMap(o, isCount){ const r=Object.create(null); if(!isObj(o)) return {}; let extra=0;
  const keys=Object.keys(o).filter(k=>typeof k==='string' && k.length<=200 && k!=='__proto__');
  for(const k of keys.sort((a,b)=>KEYS.has(b)-KEYS.has(a))){ const v=o[k];
    if(!KEYS.has(k) && ++extra>5000) break;
    if(isCount){ const n=Math.floor(Number(v)); if(n>0) r[k]=Math.min(n,999); } else if(v) r[k]=1; }
  return Object.assign({}, r); }
function cleanImp(a){ const r=Array.isArray(a)?[3,2,1].filter(x=>a.includes(x)):[]; return r.length?r:[3,2,1]; }
function sanitize(o){ const s=JSON.parse(JSON.stringify(DEF)); if(!isObj(o)) return s;
  s.known=cleanMap(o.known,false); s.wrong=cleanMap(o.wrong,true); s.right=cleanMap(o.right,true);
  if(['cards','quiz','weak','list'].includes(o.tab)) s.tab=o.tab;
  if(isObj(o.cards)){ s.cards.imp=cleanImp(o.cards.imp); s.cards.hideKnown=o.cards.hideKnown===true; }
  if(isObj(o.quiz)){ const q=o.quiz;
    s.quiz.maj=Array.isArray(q.maj)?[...new Set(q.maj.map(Number).filter(m=>Number.isInteger(m)&&m>=1&&m<=DATA.majors.length))]:[];
    s.quiz.imp=cleanImp(q.imp); s.quiz.n=[10,20,30].includes(Number(q.n))?Number(q.n):10; s.quiz.mode=q.mode==='t2d'?'t2d':'d2t'; }
  return s; }
try{ const raw=localStorage.getItem(SKEY); if(raw) S=sanitize(JSON.parse(raw)); }catch(e){ S=JSON.parse(JSON.stringify(DEF)); }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
// 別のタブで同時に開いていても記録を上書きし合わないよう、他タブの保存を取り込む
window.addEventListener('storage',e=>{ if(e.key!==SKEY || !e.newValue) return; try{ const o=sanitize(JSON.parse(e.newValue)); S.known=o.known; S.wrong=o.wrong; S.right=o.right; header(); }catch(_){} });
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1400); }

function header(){
  const k=T.filter(t=>S.known[t.key]).length, n=T.length, C=2*Math.PI*16;
  $('#ring').innerHTML='<div>覚えた<b>'+k+'<span style="color:var(--muted);font-size:11px"> / '+n+'</span></b></div><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bgc" cx="20" cy="20" r="16"/><circle class="fgc" cx="20" cy="20" r="16" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-k/n))+'"/></svg>';
  const w=Object.keys(S.wrong).filter(k=>KEYS.has(k)).length, b=$('#wbadge'); b.hidden=!w; b.textContent=w>99?'99+':w;
}

// ---------- tabs ----------
const views={cards:renderCards, quiz:renderQuiz, weak:renderWeak, list:renderList};
function go(tab){ S.tab=tab; save(); document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false')); header(); views[tab](); window.scrollTo(0,0); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.tab==='cards' && S.tab==='cards' && deck){ deck=null; } go(b.dataset.tab); }));

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function detailHTML(t, opt){
  opt=opt||{};
  let h='<dl class="kv">';
  if(t.rd && !opt.noRd) h+='<dt>読み</dt><dd>'+esc(t.rd)+'</dd>';
  if(t.mn) h+='<dt>訳・英語</dt><dd>'+esc(t.mn)+'</dd>';
  if(t.al) h+='<dt>別表記</dt><dd>'+esc(t.al)+'</dd>';
  if(!opt.noSub) h+='<dt>分類</dt><dd><span class="mono">'+esc(t.sub)+'</span> '+esc(DATA.subs[t.sub]||'')+'</dd>';
  h+='</dl><p class="desc">'+esc(t.ds)+'</p>';
  return h;
}
function impChips(id, arr){ return '<div class="seg" id="'+id+'">'+[3,2,1].map(x=>'<button class="chip" type="button" data-imp="'+x+'" aria-pressed="'+arr.includes(x)+'">'+STARS[x]+'</button>').join('')+'</div>'; }
function bindImp(id, arr, cb){ document.querySelectorAll('#'+id+' [data-imp]').forEach(b=>b.onclick=()=>{const x=+b.dataset.imp; const i=arr.indexOf(x); if(i>=0){ if(arr.length>1) arr.splice(i,1); else return toast('重要度は1つ以上選んでください'); } else arr.push(x); save(); cb(); }); }

// =====================================================================
// 単語カード
// =====================================================================
let deck=null, deckMaj=0, pos=0, flipped=false, hist=[];
function cardPool(m){ return (m? byMajor[m] : T).filter(t=>S.cards.imp.includes(t.imp)); }
function startDeck(m, list){
  deckMaj=m; let src = list || cardPool(m);
  if(!list && S.cards.hideKnown) src=src.filter(t=>!S.known[t.key]);
  deck = src.slice(); if(!m || list) shuffle(deck);
  pos=0; flipped=false; hist=[]; renderCards();
}
function renderCards(){ if(deck) renderDeck(); else renderDeckHome(); }
function renderDeckHome(){
  const imp=S.cards.imp; const all=cardPool(0); const allK=all.filter(t=>S.known[t.key]).length;
  let h='<section class="view">';
  h+='<div class="field"><div class="sec-label"><span>重要度でしぼる</span></div>'+impChips('cimp',imp)+'</div>';
  h+='<label class="toggle" for="hk"><span>覚えた語はカードに出さない</span><input type="checkbox" id="hk"'+(S.cards.hideKnown?' checked':'')+'></label>';
  h+='<button class="mix" type="button" id="mixall"><div><div class="big">全分野ミックス</div><div class="s">'+all.length+'語をシャッフル ・ 覚えた '+allK+'</div></div><span class="go">›</span></button>';
  FIELDS.forEach(([name,c,a,b])=>{
    h+='<div class="sec-label"><span>'+name+'</span></div><div class="tiles">';
    for(let m=a;m<=b;m++){ const p=cardPool(m), k=p.filter(t=>S.known[t.key]).length;
      h+='<button class="tile '+fcls(m)+(p.length&&k===p.length?' done':'')+'" type="button" data-m="'+m+'"><span class="no">'+String(m).padStart(2,'0')+'</span><span class="nm">'+esc(MN(m))+'</span><span class="bar"><i style="width:'+(p.length?k/p.length*100:0)+'%"></i></span><span class="ct"><span>覚えた '+k+'</span><span>'+p.length+'語</span></span></button>';
    }
    h+='</div>';
  });
  h+='</section>';
  $('#main').innerHTML=h;
  bindImp('cimp', imp, renderDeckHome);
  $('#hk').onchange=e=>{S.cards.hideKnown=e.target.checked; save();};
  $('#mixall').onclick=()=>startDeck(0);
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>startDeck(+b.dataset.m));
}
function cardFace(t, withDetail){
  return '<div class="band '+fcls(t.maj)+'"><span class="sc"><span class="mono">'+esc(t.sub)+'</span><span>'+esc(DATA.subs[t.sub]||MN(t.maj))+'</span></span><span class="stars">'+STARS[t.imp]+'</span></div>'+
    '<div class="face"><div class="term">'+esc(t.jp)+'</div>'+
    (withDetail? (t.rd?'<div class="rdg">'+esc(t.rd)+'</div>':'')+'<div class="detail">'+detailHTML(t,{noRd:true,noSub:true})+'</div>'
               : '<div class="hint"><span>タップで意味を見る</span></div>')+
    (t.add?'<div style="text-align:center"><span class="tag">追加した関連用語</span></div>':'')+
    '</div>'+(S.known[t.key]?'<div class="kn">✓ 覚えた</div>':'');
}
function renderDeck(){
  const m=$('#main');
  const title = deckMaj? String(deckMaj).padStart(2,'0')+' '+MN(deckMaj) : '全分野ミックス';
  if(!deck.length){ m.innerHTML='<section class="view"><div class="deckbar"><button class="back" id="bk" type="button">‹ 分野</button><span class="ttl">'+esc(title)+'</span></div><div class="empty">この条件で出せるカードがありません。<br>重要度の条件や「覚えた語は出さない」設定を見直してください。</div></section>'; $('#bk').onclick=()=>{deck=null;renderCards();}; return; }
  if(pos>=deck.length) return renderDeckEnd(title);
  const t=deck[pos], nx=deck[pos+1];
  m.innerHTML='<section class="view">'+
    '<div class="deckbar"><button class="back" id="bk" type="button">‹ 分野</button><span class="ttl">'+esc(title)+'</span><span class="pos mono">'+(pos+1)+' / '+deck.length+'</span></div>'+
    '<div class="qbar"><i style="width:'+(pos/deck.length*100)+'%"></i></div>'+
    '<div class="stack" id="stack">'+(nx?'<div class="card under '+fcls(nx.maj)+'">'+cardFace(nx,false)+'</div>':'')+
      '<div class="card '+fcls(t.maj)+'" id="card" role="button" tabindex="0" aria-label="'+esc(t.jp)+'。タップでめくる。右スワイプで覚えた、左スワイプでまだ">'+cardFace(t,flipped)+
      '<div class="stamp yes" id="sy">覚えた</div><div class="stamp no" id="sn">まだ</div></div></div>'+
    '<div class="actions"><button class="btn ng" id="nope" type="button">← まだ</button><button class="undo" id="undo" type="button"'+(hist.length?'':' disabled')+'>戻す</button><button class="btn ok" id="got" type="button">覚えた →</button></div>'+
    '<div class="swipehint">カードを右へスワイプで「覚えた」、左へで「まだ」</div>'+
  '</section>';

    if(!down) return; dx=e.clientX-x0; const dy=e.clientY-y0;

  });

function baseName(s){ return s.replace(/（[^）]*）$/,''); }
function maskDesc(t){

  if(!words.length) return esc(t.ds);

  return String(t.ds).split(re).map((p,i)=>i%2?'<span class="mask">'+esc(p)+'</span>':esc(p)).join('');
}
function quizPool(){ const q=S.quiz; return T.filter(t=>(!q.maj.length||q.maj.includes(t.maj)) && q.imp.includes(t.imp)); }
function weight(t){ return (S.known[t.key]?1:3) + 3*(S.wrong[t.key]||0) - Math.min(2,(S.right[t.key]||0)*.5); }
function pickWeighted(list,n){

}

// --- search normalization & fuzzy ---
function norm(s){
  return (s||'').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s・･\-‐－—_／/（）()「」、，,.。:：]/g,'');
}
const strip=s=>s.replace(/ー/g,'');
let IDX=null;
function grams(s){ const g=new Set(); if(s.length===1){g.add(s);return g;} for(let i=0;i<s.length-1;i++) g.add(s.slice(i,i+2)); return g; }
function buildIdx(){ IDX=T.map(t=>{ const keys=[t.jp,t.rd,t.mn].concat((t.al||'').split('、')).map(norm).filter(Boolean); const sk=keys.map(strip); return {t, keys, sk, grams:sk.map(grams), dsn:norm(t.ds)}; }); }
function dice(a,b){ if(!a.size||!b.size) return 0; let n=0; a.forEach(x=>{if(b.has(x)) n++;}); return 2*n/(a.size+b.size); }
function lev(a,b){ if(Math.abs(a.length-b.length)>3) return 9; const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function search(q){
  if(!IDX) buildIdx();
  const nq=norm(q); if(!nq) return null; const sq=strip(nq)||nq; const gq=grams(sq);
  const hit=[], near=[], inDesc=[];
  IDX.forEach(x=>{
    let best=-1;
    x.keys.forEach((k,i)=>{ if(k===nq||x.sk[i]===sq) best=Math.max(best,3); else if(k.startsWith(nq)||x.sk[i].startsWith(sq)) best=Math.max(best,2); else if(k.includes(nq)) best=Math.max(best,1); });
    if(best>=0){ hit.push({x,s:best}); return; }
    let f=0; x.grams.forEach((g,i)=>{ let d=dice(gq,g); if(sq.length<=6){ const k=x.sk[i]; const L=lev(sq,k.slice(0,sq.length+1)); if(L<=1 && sq.length>=3) d=Math.max(d,.7); } if(d>f) f=d; });
    if(f>=0.45) near.push({x,s:f});
    else if(nq.length>=2 && x.dsn.includes(nq)) inDesc.push({x,s:0});
  });
  hit.sort((a,b)=>b.s-a.s||a.x.t.jp.length-b.x.t.jp.length);
  near.sort((a,b)=>b.s-a.s);
  const seen=new Set(); const uniq=a=>a.map(h=>h.x.t).filter(t=>{const k=t.jp+'|'+t.ds; if(seen.has(k)) return false; seen.add(k); return true;});
  return {hit:uniq(hit), near:uniq(near).slice(0,15), inDesc:uniq(inDesc).slice(0,20)};
}
let listQ='';
function renderList(){
  let h='<section class="view"><div class="searchbox"><div class="search"><span class="ico">⌕</span><input id="q" type="search" enterkeyhint="search" placeholder="用語・読み・英語・略語（例：xor、はいた）" value="'+esc(listQ)+'" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="clr" id="clr" type="button" aria-label="入力を消す"'+(listQ?'':' hidden')+'>×</button></div></div><div id="res"></div></section>';
  $('#main').innerHTML=h;
  const inp=$('#q'); let tm;
  inp.addEventListener('input',()=>{ listQ=inp.value; $('#clr').hidden=!listQ; clearTimeout(tm); tm=setTimeout(fill,120); });
  $('#clr').onclick=()=>{ listQ=''; inp.value=''; $('#clr').hidden=true; fill(); inp.focus(); };
  fill();
}
function hlFn(q){
  const nq=q.trim(); if(!nq) return null;
  return s=>{ const e=esc(s||''); const i=(s||'').toLowerCase().indexOf(nq.toLowerCase()); if(i<0) return e; return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+nq.length))+'</mark>'+esc(s.slice(i+nq.length)); };
}
function fill(){
  const box=$('#res'); if(!box) return; const r=search(listQ);
  if(!r){
    let h='<p class="count">全'+T.length+'語。分野をタップすると用語が開きます。</p>';
    FIELDS.forEach(([name,c,a,b])=>{
      h+='<div class="sec-label"><span>'+name+'</span></div>';
      for(let m=a;m<=b;m++){ const p=byMajor[m], k=p.filter(t=>S.known[t.key]).length;
        h+='<details class="fsec '+fcls(m)+'" data-m="'+m+'"><summary><span class="no">'+String(m).padStart(2,'0')+'</span><span class="nm">'+esc(MN(m))+'</span><span class="ct">'+p.length+'語<br>覚えた '+k+'<span class="chev">▾</span></span></summary><div class="bar"><i style="width:'+(k/p.length*100)+'%"></i></div><div class="items"></div></details>';
      }
    });
    box.innerHTML=h;
    box.querySelectorAll('details.fsec').forEach(d=>d.addEventListener('toggle',()=>{
      const it=d.querySelector('.items'); if(!d.open || it.dataset.done) return; it.dataset.done=1;
      const m=+d.dataset.m; let html='', cur='';
      byMajor[m].forEach(t=>{ if(t.sub!==cur){ cur=t.sub; html+='<div class="subhd">'+esc(t.sub)+' '+esc(DATA.subs[t.sub]||'')+'</div>'; } html+=itemHTML(t,false); });
      it.innerHTML=html; bindItems(it);
    }));
    return;
  }
  const hl=hlFn(listQ);
  let h='';
  const tier=(title,pill,list,limit)=>{ if(!list.length) return ''; let s='<div class="tier"><h3>'+title+'<span class="pill">'+pill+'</span></h3><div class="flat">'+list.slice(0,limit).map(t=>itemHTML(t,true,null,hl)).join('')+'</div>'+(list.length>limit?'<p class="count">ほか'+(list.length-limit)+'語。もう少し詳しく入力してください。</p>':'')+'</div>'; return s; };
  if(!r.hit.length && !r.near.length && !r.inDesc.length) h='<div class="empty">「'+esc(listQ)+'」に近い用語は見つかりませんでした。<br>読み（ひらがな）や英語・略語でも探せます。</div>';
  h+=tier('一致する用語', r.hit.length+'語', r.hit, 60);
  h+=tier(r.hit.length?'もしかして':'もしかしてこれ？', '似た表記', r.near, 15);
  h+=tier('説明文に含む用語', r.inDesc.length+(r.inDesc.length>=20?'+':'')+'語', r.inDesc, 20);
  box.innerHTML=h; bindItems(box);
}

go(views[S.tab]?S.tab:'cards');
})();
</script>

<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
